# MongoDB (defina via ambiente; nunca commitar credencial)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/login_java}
spring.data.mongodb.database=${MONGODB_DATABASE:login_java}
spring.data.mongodb.auto-index-creation=true

# Sessões HTTP persistidas no MongoDB.
spring.session.store-type=mongodb
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.session.mongodb.collection-name=sessions

app.nome=${APP_NOME:Sistema de Login}

# Tema visual ativo (troque o arquivo static/css/tema-<nome>.css para personalizar)
app.tema.nome=${APP_TEMA_NOME:padrao}

# Conta administradora inicial (seed no primeiro boot)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.email=${APP_ADMIN_EMAIL:admin@local}
app.admin.nome=${APP_ADMIN_NOME:Administrador}

# Recovery: token de uso único válido por 60 minutos
app.recovery.token-minutos=60
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Envio seguro do link de recuperação
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.mail.from=${SMTP_FROM:no-reply@localhost}

# Bloqueio após tentativas inválidas
app.login.max-tentativas=5
app.login.bloqueio-minutos=15

# Documentos legais (aceite versionado obrigatório)
app.legal.termos-versao=1.0
app.legal.privacidade-versao=1.0

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.example.login=INFO
