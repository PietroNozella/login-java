<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="'Criar conta | ' + ${appNome}">Criar conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/tema-padrao.css}">
    <link rel="stylesheet" th:if="${temaNome != 'padrao'}" th:href="@{'/css/tema-' + ${temaNome} + '.css'}">
</head>
<body>
    <main class="login-container">
        <div class="login-card cadastro-card">
            <p class="text-muted" th:text="${appNome}">Sistema de Login</p>
            <h1 class="h3 mb-3">Criar conta</h1>
            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
            <form th:action="@{/cadastro}" th:object="${form}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="nome">Nome *</label>
                    <input class="form-control" id="nome" th:field="*{nome}" autocomplete="given-name" required maxlength="150">
                    <div class="text-danger small" th:errors="*{nome}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="sobrenome">Sobrenome *</label>
                    <input class="form-control" id="sobrenome" th:field="*{sobrenome}" autocomplete="family-name" required maxlength="150">
                    <div class="text-danger small" th:errors="*{sobrenome}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">E-mail *</label>
                <input class="form-control" id="email" type="email" th:field="*{email}" autocomplete="email" required maxlength="254">
                <div class="text-danger small" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="username">Nome de usuário *</label>
                <input class="form-control" id="username" th:field="*{username}" autocomplete="username" required minlength="3" maxlength="150">
                <div class="text-danger small" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="senha">Senha * (mín. 8 caracteres)</label>
                <input class="form-control" id="senha" type="password" name="senha" autocomplete="new-password" required minlength="8" maxlength="72">
                <div class="text-danger small" th:errors="*{senha}"></div>
            </div>

                <button class="btn btn-primary w-100" type="submit">Criar conta</button>
            </form>
            <p class="text-center mt-3 mb-0">Já tem uma conta? <a th:href="@{/login}">Entrar</a></p>
            <p class="small text-center mt-3 mb-0"><a th:href="@{/termos}">Termos de Uso</a> · <a th:href="@{/privacidade}">Privacidade</a></p>
        </div>
    </main>
</body>
</html>
