<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div th:fragment="sidebar">
        <button type="button" class="toggle-btn btn btn-dark" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">☰</button>
        <nav id="sidebar" aria-label="Menu principal">
            <h2 class="h5 text-center py-3 px-3" th:text="${appNome}">Sistema de Login</h2>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/minha-senha}">Trocar senha</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" th:href="@{/usuarios/novo}">Cadastrar usuário</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')"><a class="nav-link" th:href="@{/auditoria}">Auditoria</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/termos}">Termos de Uso</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/privacidade}">Privacidade</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="px-3 py-2">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline-light btn-sm w-100">Sair</button>
                    </form>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
