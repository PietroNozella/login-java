<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Cadastrar usuário | ' + ${appNome}">Cadastrar usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/tema-padrao.css}">
    <link rel="stylesheet" th:if="${temaNome != 'padrao'}" th:href="@{'/css/tema-' + ${temaNome} + '.css'}">
</head>
<body>
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <main id="content" class="container mt-4" style="max-width: 640px">
        <h2 class="mb-1">Cadastrar usuário</h2>
        <p class="text-muted">Crie uma conta e selecione seu perfil de acesso.</p>

        <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
        <div th:if="${ok}" class="alert alert-success" role="status" th:text="${ok}"></div>

        <form th:action="@{/usuarios/novo}" th:object="${form}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="nome">Nome *</label>
                    <input class="form-control" id="nome" th:field="*{nome}" autocomplete="given-name" required maxlength="150">
                    <div class="text-danger small" th:errors="*{nome}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="sobrenome">Sobrenome *</label>
                    <input class="form-control" id="sobrenome" th:field="*{sobrenome}" autocomplete="family-name" required maxlength="150">
                    <div class="text-danger small" th:errors="*{sobrenome}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">E-mail *</label>
                <input class="form-control" id="email" type="email" th:field="*{email}" autocomplete="email" required maxlength="254">
                <div class="text-danger small" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="username">Nome de usuário *</label>
                <input class="form-control" id="username" th:field="*{username}" autocomplete="username" required minlength="3" maxlength="150">
                <div class="text-danger small" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="perfil">Perfil *</label>
                <select class="form-select" id="perfil" th:field="*{perfil}" required>
                    <option value="">Selecione um perfil</option>
                    <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option>
                </select>
                <div class="text-danger small" th:errors="*{perfil}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="senha">Senha inicial * (mín. 8 caracteres)</label>
                <input class="form-control" id="senha" type="password" name="senha" autocomplete="new-password" required minlength="8" maxlength="72">
                <div class="text-danger small" th:errors="*{senha}"></div>
            </div>
            <button class="btn btn-primary" type="submit">Cadastrar usuário</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
        </form>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
