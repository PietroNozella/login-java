<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Trocar senha | ' + ${appNome}">Trocar senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/tema-padrao.css}">
    <link rel="stylesheet" th:if="${temaNome != 'padrao'}" th:href="@{'/css/tema-' + ${temaNome} + '.css'}">
</head>
<body>
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <main id="content" class="container mt-4" style="max-width: 520px">
        <h2 class="mb-4">Trocar senha</h2>

        <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
        <div th:if="${ok}" class="alert alert-success" role="status" th:text="${ok}"></div>

        <form th:action="@{/minha-senha}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label" for="senhaAtual">Senha atual</label>
                <input class="form-control" id="senhaAtual" type="password" name="senhaAtual" autocomplete="current-password" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="senhaNova">Nova senha (mín. 8 caracteres)</label>
                <input class="form-control" id="senhaNova" type="password" name="senhaNova" autocomplete="new-password" required minlength="8" maxlength="72">
            </div>
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
        </form>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
