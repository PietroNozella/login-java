<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Aceite de documentos | ' + ${appNome}">Aceite de documentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tema-padrao.css}">
    <link rel="stylesheet" th:if="${temaNome != 'padrao'}" th:href="@{'/css/tema-' + ${temaNome} + '.css'}">
</head>
<body>
    <div class="container mt-5" style="max-width: 640px">
        <h2 class="mb-1">Antes de continuar</h2>
        <p class="text-muted">É necessário aceitar os documentos abaixo para acessar o sistema.</p>

        <ul class="list-group mb-4">
            <li class="list-group-item">
                <a th:href="@{/termos}" target="_blank">Termo de Uso</a>
                <span class="text-muted" th:text="' (versão ' + ${termosVersao} + ')'"></span>
            </li>
            <li class="list-group-item">
                <a th:href="@{/privacidade}" target="_blank">Política de Privacidade</a>
                <span class="text-muted" th:text="'(versão ' + ${privacidadeVersao} + ')'"></span>
            </li>
        </ul>

        <form th:action="@{/aceite}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="aceito" required>
                <label class="form-check-label" for="aceito">
                    Li e aceito o Termo de Uso e a Política de Privacidade.
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Aceitar e continuar</button>
        </form>

        <form th:action="@{/logout}" method="post" class="mt-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-link">Sair</button>
        </form>
    </div>
</body>
</html>
