<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="'Redefinir senha | ' + ${appNome}">Redefinir senha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/tema-padrao.css}">
    <link rel="stylesheet" th:if="${temaNome != 'padrao'}" th:href="@{'/css/tema-' + ${temaNome} + '.css'}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <p class="text-muted" th:text="${appNome}">Sistema de Login</p>
            <h3 class="mb-4">Redefinir senha</h3>

            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

            <form th:action="@{'/redefinir-senha/' + ${token}}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="senhaNova">Nova senha (mín. 8 caracteres)</label>
                    <input class="form-control" id="senhaNova" type="password" name="senhaNova" autocomplete="new-password" required minlength="8" maxlength="72">
                </div>
                <button type="submit" class="btn btn-primary w-100">Redefinir</button>
            </form>
        </div>
    </div>
</body>
</html>
