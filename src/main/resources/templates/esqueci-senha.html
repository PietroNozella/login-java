<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="'Esqueci minha senha | ' + ${appNome}">Esqueci minha senha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/tema-padrao.css}">
    <link rel="stylesheet" th:if="${temaNome != 'padrao'}" th:href="@{'/css/tema-' + ${temaNome} + '.css'}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <p class="text-muted" th:text="${appNome}">Sistema de Login</p>
            <h3 class="mb-1">Esqueci minha senha</h3>
            <p class="text-muted">Informe o e-mail da conta. O link vale por 60 minutos.</p>

            <div th:if="${ok}" class="alert alert-info" role="status" th:text="${ok}"></div>
            <form th:action="@{/esqueci-senha}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input class="form-control" id="email" type="email" name="email" autocomplete="email" required maxlength="254">
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar link</button>
            </form>
            <div class="mt-3 text-center">
                <a th:href="@{/login}" class="text-decoration-none">Voltar ao login</a>
            </div>
        </div>
    </div>
</body>
</html>
