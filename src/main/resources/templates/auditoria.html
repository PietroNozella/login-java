<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Auditoria | ' + ${appNome}">Auditoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/tema-padrao.css}">
    <link rel="stylesheet" th:if="${temaNome != 'padrao'}" th:href="@{'/css/tema-' + ${temaNome} + '.css'}">
</head>
<body>
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <main id="content" class="container mt-4">
        <h2 class="mb-1">Auditoria</h2>
        <p class="text-muted">Autenticação, acessos negados e ações relevantes. Somente leitura.</p>

        <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Quando</th>
                    <th>Usuário</th>
                    <th>Ação</th>
                    <th>Resultado</th>
                    <th>IP</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${registros}">
                    <td th:text="${r.quando}"></td>
                    <td th:text="${r.usuario}"></td>
                    <td th:text="${r.acao}"></td>
                    <td th:text="${r.resultado}"></td>
                    <td th:text="${r.ip}"></td>
                </tr>
            </tbody>
        </table>
        </div>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
